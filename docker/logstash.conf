# TA-LSTMAE alerts: HTTP input (JSON) -> Elasticsearch index "ta-lstmae-alerts"
input {
  http { port => 8080 codec => json }
}
filter {
  mutate { remove_field => ["headers", "host", "url", "user_agent", "http"] }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ta-lstmae-alerts"
    document_id => "%{[event][id]}"
  }
}
