# Minimal single-node ELK stack for the end-to-end latency experiment (notebook 03).
# Security is disabled for a local, isolated testbed only. Do not expose these ports publicly.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      retries: 30
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    volumes: ["./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"]
    environment:
      - xpack.monitoring.enabled=false
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["8080:8080"]
    depends_on:
      elasticsearch: {condition: service_healthy}
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment: ["ELASTICSEARCH_HOSTS=http://elasticsearch:9200"]
    ports: ["5601:5601"]
    depends_on:
      elasticsearch: {condition: service_healthy}
